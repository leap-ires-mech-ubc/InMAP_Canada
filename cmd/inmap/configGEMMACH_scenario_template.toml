# Preprocessed annual/monthly meteorology and chemistry fields used by InMAP.
# Generated by the Preproc step and read directly during model initialization.
InMAPData= "/home/tfmrodge/scratch/GEMMACH_data/data/Inmap_outputs/Preproc/20260210/20260217_inmapData_GEMMACH_BASEGM_2015_017_fill0.nc"

# Create a variable-resolution grid based on population and concentration criteria.
creategrid=true

# If true, the grid is refined once during initialization and then remains fixed.
# If false, the grid may be dynamically adapted during model execution.
static=true

OutputFile= "/home/tfmrodge/scratch/GEMMACH_data/data/Inmap_outputs/Outputs/20260310_InmapOuts_BAU_2020_E108_static.shp"

# Emission rate units expected by InMAP. Must match emission files.
EmissionUnits= "g/s"

# Area and point-source emission inventories.
# Inputs can remain in EPSG:4326; they are projected internally to GridProj.
# InMAP can handle an arbitrary number of emissions files and will just sum them, if it is easier than generating
# single large files
EmissionsShapefiles = [
    "/home/tfmrodge/scratch/GEMMACH_data/data/emissions_nc/20260223/20260223_BAU_2020_E108_area_EPSG4326.shp",
    "/home/tfmrodge/scratch/GEMMACH_data/Emissions_shp/BAU_2020_E108_majorpts.shp"
]

[OutputVariables]

# Standard PM2.5 species aggregation.
TotalPM25 = "PrimaryPM25 + pNH4 + pSO4 + pNO3 + SOA"

# Attributable deaths using a 7.8% increase in mortality per 10 µg m-3 PM2.5.
TotalPopD = "(exp(log(1.078)/10 * TotalPM25) - 1) * TotalPop * AllCause / 100000"

# Population and mortality fields.
TotalPop = "TotalPop"
AllCause = "AllCause"

# Pollutant outputs.
PrimPM25 = "PrimaryPM25"
PSO4 = "pSO4"
PNO3 = "pNO3"
PNH4 = "pNH4"
SOA = "SOA"
SOx = "SOx"
NH3 = "NH3"
NOx = "NOx"
VOC = "VOC"

# Baseline concentrations from CTM preprocessing.
BasePM25 = "BaselineTotalPM25"
BaseVOC = "BaselineVOC"
BaseSOA = "BaselineSOA"
BaseNH3 = "BaselineNH3"
BasePNH4 = "BaselinePNH4"
BaseSOx = "BaselineSOx"
BasePSO4 = "BaselinePSO4"
BaseNOx = "BaselineNOx"
BasePNO3 = "BaselinePNO3"

[VarGrid]

# Projection of the CTM and InMAP computational grid.
# Population, mortality, and emissions are transformed into this CRS.
GridProj= "+proj=lcc +lat_0=40 +lon_0=-96 +lat_1=50 +lat_2=70 +x_0=0 +y_0=0 +ellps=GRS80 +datum=NAD83 +units=m +to_meter=1"

# Number of cells in the outermost grid.
# Each additional value creates a further nesting level by subdividing parent cells.
Xnests= [171,2,2,2,2,2,2,2]
VariableGridDx= 40000.0

Ynests= [147,2,2,2,2,2,2,2]
VariableGridDy= 40000.0

# Lower-left corner of the outermost grid (GridProj coordinates).
VariableGridXo= -4014266.50
VariableGridYo= -1529822.83

# Only the lowest 8 vertical layers are eligible for horizontal refinement.
HiResLayers= 8

# Refine cells if the intersecting census polygon population density exceeds this value.
PopDensityThreshold= 27500000.0

# Refine cells if total population exceeds this value.
PopThreshold= 50000.0

# Refine cells if
# Σ(|ΔC|)*(combined volume)*|ΔPopulation|
# ---------------------------------------
#     TotalPollutionMass*TotalPopulation
#
# exceeds this threshold for any neighboring cell.
# Targets locations where pollution gradients coincide with population gradients.
PopConcThreshold= 0.000000001

# Population dataset used for grid generation and population exposure calculations.
CensusPopColumns= ["TotalPop"]

# Population field used by refinement algorithms.
PopGridColumn= "TotalPop"

CensusFile= "/home/tfmrodge/scratch/GEMMACH_data/data/Inmap_outputs/PopData/inmap_can_pop_DA.shp"

# Baseline mortality rates used for health impact calculations. This is not parameterized currently for Canada
MortalityRateFile= "/home/tfmrodge/projects/def-rscholes/tfmrodge/InMAP_Canada/cmd/inmap/testdata/testMortalityRate.shp"

[VarGrid.MortalityRateColumns]

# Mortality field name in MortalityRateFile mapped to the population group
# used for population-weighted averaging. This is not parameterized for inMAP-CANADA
AllCause = "TotalPop"

[Preproc]
# Items in [Preproc] only impact when the preprocessor is run. 
# Meteorology source used during preprocessing.
CTMType= "GEMMACH"

# Start date is inclusive.
# End date is exclusive.
# This configuration processes February 2019 only.
StartDate= "20190201"
EndDate= "20190301"

# Lower-left corner of the GEMMACH CTM grid.
CtmGridXo= -4084285.4453117
CtmGridYo= -1929796.221

# CTM grid spacing.
CtmGridDx= 10002.6608465054
CtmGridDy= 10002.6608465054

[Preproc.GEMMACH]

# GEMMACH chemistry output files.
# [DATE] is replaced using StartDate/EndDate.
gem_out= "/home/tfmrodge//scratch/GEMMACH_data/data/nc3/BASEGM_2015_017/[DATE]_gemmach.nc"

# Static geophysical fields 
gem_geophy= "/home/tfmrodge//scratch/GEMMACH_data/data/nc3/GEOPHY_VF/gem_geophy.nc"

# RDPS meteorology used to supplement GEMMACH fields.
gem_rdps= "/home/tfmrodge//scratch/GEMMACH_data/data/nc3/RDPS_QC/[DATE]_rdpsqc.nc"

# Read meteorological fields without a time-record dimension.
# Refers to NetCDF file structure rather than chemistry timestep length.
gemnoChemHour= true